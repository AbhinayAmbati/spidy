name: Release APK

# Builds an installable release APK.
#
#   Run manually: Actions > Release APK > Run workflow. The APK is attached to the run as the
#   "spidey-apk" artefact (download the zip from the run page, unzip, install spidy.apk).
#
#   Push a v* tag: the same build, and the APK is also attached to a GitHub Release.
#
# Signing: with the four repository secrets below the APK is signed with your release key.
# Without them it is signed with the debug key, which installs fine for testing but cannot be
# used to update a build signed with a different key, and is not for distribution.
#   KEYSTORE_BASE64     base64 of the .p12/.jks/.keystore file
#   KEYSTORE_PASSWORD   the keystore password
#   KEY_ALIAS           the key alias inside the keystore
#   KEY_PASSWORD        the password for that key

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # The wrapper jar is a binary and is not committed, so generate it first.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Check cross-package imports
        run: python3 tools/check_imports.py app/src

      - name: Check symbol imports
        run: python3 tools/check_symbols.py app/src

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Secrets are optional. When all four are present the build signs with them; otherwise
      # build.gradle.kts falls back to the debug key. Values go through env, never through the
      # shell command line, so a password with metacharacters cannot be interpreted.
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "signed_with=debug key (no signing secrets set)" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set; the APK will be signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
          echo "signed_with=release key" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      # Gradle names the artefact spidy.apk; this keeps the name fixed if that ever changes.
      - name: Normalise the APK name
        run: |
          APK_DIR=app/build/outputs/apk/release
          if [ ! -f "$APK_DIR/spidy.apk" ]; then
            SRC=$(ls "$APK_DIR"/*.apk | head -n 1)
            cp "$SRC" "$APK_DIR/spidy.apk"
          fi
          ls -la "$APK_DIR"

      # Proves the file is a validly signed APK, not just that the task ran.
      - name: Verify the APK signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/spidy.apk

      - name: Summarise the build
        run: |
          APK=app/build/outputs/apk/release/spidy.apk
          {
            echo "### Spidey release APK"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Signed with: ${{ steps.signing.outputs.signed_with }}"
            echo "- Size: $(du -h "$APK" | cut -f1)"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo ""
            echo "Download the **spidey-apk** artefact below, unzip it, and install \`spidy.apk\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spidey-apk
          path: app/build/outputs/apk/release/spidy.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/spidy.apk
          gh release create "${GITHUB_REF_NAME}" "$APK" \
            --title "Spidey ${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
