name: Release APK

# Builds a *signed* release APK with `assembleRelease` and attaches it to a GitHub
# Release. Signing material comes from repository secrets — nothing is committed:
#   KEYSTORE_BASE64     base64 of your .p12/.jks/.keystore file
#   KEYSTORE_PASSWORD   the keystore (store) password
#   KEY_ALIAS           the key alias inside the keystore
#   KEY_PASSWORD        the password for that key
# See README > "Releasing" for how to produce these.

on:
  push:
    tags:
      - 'v*'
  # Manual runs build the signed APK and upload it as an artifact only;
  # pushing a v* tag additionally attaches it to a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # The wrapper jar is a binary and is not committed, so generate it first.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # Fail loudly rather than silently producing a debug-signed build.
      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the four signing secrets described in README > Releasing."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      # Values are passed through env so a password containing shell metacharacters
      # can never be interpreted by the shell.
      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease --stacktrace

      # Gradle names the release artefact spidy.apk. This keeps the name
      # deterministic even if that naming rule is ever changed.
      - name: Normalise the APK name
        run: |
          APK_DIR=app/build/outputs/apk/release
          if [ ! -f "$APK_DIR/spidy.apk" ]; then
            SRC=$(ls "$APK_DIR"/*.apk | head -n 1)
            echo "Renaming $(basename "$SRC") -> spidy.apk"
            cp "$SRC" "$APK_DIR/spidy.apk"
          fi
          ls -la "$APK_DIR"

      # Prove the artefact is signed with the expected key, not just that the task ran.
      - name: Verify the APK signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK=app/build/outputs/apk/release/spidy.apk
          echo "Verifying $APK"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      # Always runs, so a red build is diagnosable from the run page without
      # anyone having to reproduce it locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spidy-release-apk
          path: app/build/outputs/apk/release/spidy.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/spidy.apk \
            --title "Spidey ${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/spidy.apk --clobber
