name: Supply chain checks

# Two gates that depend on the outside world rather than on our code, so they also run on a
# schedule: a model replaced on Hugging Face, or a CVE published against a dependency we
# already ship, turns this red without any commit.
#
#   model-pins        the sha256 + size pinned in ModelSpec.kt still match Hugging Face.
#   dependency-audit  the CycloneDX SBOM of the release dependencies has no known vulnerability
#                     (OSV.dev database via OSV-Scanner; no secrets needed).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-pins:
    name: Verify pinned model hashes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # HEAD requests only; nothing is downloaded. Compares size and sha256 (X-Linked-ETag).
      - name: Verify ModelSpec.kt against Hugging Face
        run: python3 -I tools/verify_model_pins.py

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # Resolves the release runtime classpath only; it does not compile anything.
      - name: Generate the SBOM
        run: ./gradlew :app:cyclonedxDirectBom --stacktrace

      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spidey-sbom
          path: app/build/reports/cyclonedx-direct/bom.json
          if-no-files-found: error

      # Fails if any listed dependency has a known vulnerability. To accept a finding that has
      # no fix yet, add an [[IgnoredVulns]] entry (id, reason, ignoreUntil) to osv-scanner.toml.
      - name: Scan the SBOM for known vulnerabilities
        run: bash tools/osv_scan.sh app/build/reports/cyclonedx-direct/bom.json
