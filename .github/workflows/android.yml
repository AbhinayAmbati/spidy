name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      update_lint_baseline:
        description: >-
          Create or refresh app/lint-baseline.xml and attach it to the run as the
          "lint-baseline" artifact (download it, commit it, and lint becomes blocking).
        type: boolean
        default: false

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'

      # The wrapper jar is a binary and is not committed, so generate it first.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # The on-device engine (libneedle.a, needle.h) is not committed. Fetching it, verified
      # against pinned hashes, is what switches the native build on.
      - name: Fetch the on-device engine
        run: python3 tools/fetch_engine.py

      # Runs before the compiler, because a missing import for one of our own types is
      # a plain source mistake that costs a full Gradle run to discover otherwise.
      - name: Check cross-package imports
        run: python3 tools/check_imports.py app/src

      # Catches a symbol used without its import - framework and Compose symbols that
      # check_imports does not cover, and which would otherwise cost a full Gradle run.
      - name: Check symbol imports
        run: python3 tools/check_symbols.py app/src

      # Privacy tests for the PC-side UI recorder (redaction, canary strings, scanner).
      - name: UI recorder tests
        run: python3 -m unittest discover -s tools/ui_recorder/tests

      # Blocking once app/lint-baseline.xml is committed (then only NEW issues fail). Until it
      # exists the findings have never been triaged, and a red build for every pre-existing
      # warning would block all work, so the step reports without failing. hashFiles() is empty
      # when the file is absent. See docs/RELEASING.md, "Lint baseline".
      - name: Lint
        if: ${{ !inputs.update_lint_baseline }}
        continue-on-error: ${{ hashFiles('app/lint-baseline.xml') == '' }}
        run: ./gradlew lintDebug --stacktrace

      - name: Update lint baseline
        if: ${{ inputs.update_lint_baseline }}
        run: ./gradlew -Pspidey.updateLintBaseline=true :app:updateLintBaseline --stacktrace

      - name: Upload lint baseline
        if: ${{ inputs.update_lint_baseline }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-baseline
          path: app/lint-baseline.xml
          if-no-files-found: error

      # Runs the debug unit tests under JaCoCo and writes the coverage report.
      - name: Unit tests with coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --stacktrace

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = "app/build/reports/coverage/test/debug/report.xml"
          if not os.path.exists(path):
              raise SystemExit("no coverage report produced")
          # The last <counter> elements directly under <report> are the whole-project totals.
          root = ET.parse(path).getroot()
          rows = []
          for c in root.findall("counter"):
              missed, covered = int(c.get("missed")), int(c.get("covered"))
              total = missed + covered
              rows.append(f"| {c.get('type').title()} | {covered}/{total} | "
                          f"{(100.0 * covered / total) if total else 0:.1f}% |")
          out = ["### Unit test coverage (JaCoCo)", "", "| Counter | Covered | % |", "|---|---|---|", *rows]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(out) + "\n")
          PY

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Always runs, so a red build is diagnosable from the run page without
      # anyone having to reproduce it locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: app/build/reports/coverage/**
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spidey-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
